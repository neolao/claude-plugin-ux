schema_version: "1.1"
name: prototype-builds-from-siblings-and-waits
description: >
  /ux:prototype 001 on the Taskboard React app: a designed flow (inline
  rename of the board's title) with one screen spec, no design tokens,
  no style.md, literal values in src/styles.css, and a Partial state
  marked n/a. Neither the Artifact tool nor browser tools are granted,
  so the prototype is published as a file path. The skill must write a
  single-file prototype whose values are the ones src/styles.css already
  uses (not an invented palette), inline the Content table's copy, give
  the n/a Partial row no switchable state, write the file path in the
  flow's prototype: field, recommend /ux:style in its report, then stop
  and wait for the product owner — who is unreachable — leaving the flow
  and the screen `designed`. The run takes `--allow-tools Write Edit`;
  the workspace is not a git repository.
context:
  scaffold_script: fixture.sh
  add_dirs: [fixtures]
