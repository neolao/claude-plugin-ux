name: implement-source-set-and-review-run
description: >
  /ux:implement 001 on the Taskboard React app: a validated flow (inline
  rename of the board's title) with one screen spec whose source: is
  empty, an i18n layer in src/i18n.ts, a toast helper in src/toast.ts
  with no action slot, and no design tokens nor style.md. The skill must
  run ux:clarify and ux:review, fill the screen's source: with
  BoardDetail.tsx and mark it implemented, add the Undo action to the
  existing toast rather than a second toast, record that variant on the
  inventory's toast row, key every new string through t(), and recommend
  /ux:style in its report since there is no scale. AskUserQuestion is not
  granted: the prompt supplies the product owner's answers. The app
  cannot be launched. The run takes `--allow-tools Write Edit`; the
  workspace is not a git repository.
