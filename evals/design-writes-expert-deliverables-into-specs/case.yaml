schema_version: "1.1"
name: design-writes-expert-deliverables-into-specs
description: >
  /ux:design on Lumen, a native Qt desktop app (macOS and Windows) whose
  .ux/ holds product.md and inventory.md only: the need is job 1,
  duplicate a preset with its effect chain. The inventory says every
  preset action lives in the Preset menu with its accelerator and in the
  preset's context menu, and every library change goes through the
  document's QUndoStack. The skill must consult expert-flows and
  expert-platform through the Agent tool and write what the experts
  deliver where the consumers read it: the entry's platform form in step
  1 of the Flow table, the three exit & failure paths, the undo-stack
  binding in the Library screen's Interactions row, every States row
  filled or n/a with a reason, a Layout naming PresetRow, a Content table
  with keys and English (tr() source) text. AskUserQuestion is not
  granted: the prompt supplies the product owner's answers. The run
  takes `--allow-tools Write Edit`; the workspace is not a git
  repository and holds no source code.
context:
  scaffold_script: fixture.sh
  add_dirs: [fixtures]
