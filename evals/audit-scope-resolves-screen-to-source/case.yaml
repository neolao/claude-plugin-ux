schema_version: "1.1"
name: audit-scope-resolves-screen-to-source
description: >
  /ux:audit with a screen name as argument, on the same React board app. The
  name "Board detail" must resolve through the inventory's Screens table to
  src/boards/BoardDetail.tsx, which is what reaches ux:review; the rename
  job missing from that screen is in scope, while the Boards list without
  an empty case and the hardcoded placeholder of Settings › Boards belong to
  other screens and must stay out. The skill writes .ux/audit/, so the run
  takes `--allow-tools Write Edit`; the workspace is not a git repository.
context:
  scaffold_script: fixture.sh
  add_dirs: [fixtures]
